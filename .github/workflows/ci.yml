name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  luau:
    name: Format, lint, type-check, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install StyLua
        run: |
          curl -fsSL -o stylua.zip \
            https://github.com/JohnnyMorganz/StyLua/releases/latest/download/stylua-linux-x86_64.zip
          unzip -q stylua.zip -d stylua-bin
          sudo install -m755 stylua-bin/stylua /usr/local/bin/stylua
          stylua --version

      - name: Check formatting
        run: stylua --check src

      - name: Install Selene
        run: |
          curl -fsSL -o selene.zip \
            https://github.com/Kampfkarren/selene/releases/download/0.32.0/selene-0.32.0-linux.zip
          unzip -q selene.zip -d selene-bin
          sudo install -m755 selene-bin/selene /usr/local/bin/selene
          selene --version

      - name: Lint
        run: selene src

      - name: Install Rojo
        run: |
          curl -fsSL -o rojo.zip \
            https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip
          unzip -q rojo.zip -d rojo-bin
          sudo install -m755 rojo-bin/rojo /usr/local/bin/rojo
          rojo --version

      - name: Generate sourcemap
        run: rojo sourcemap -o sourcemap.json

      - name: Install Luau LSP
        run: |
          curl -fsSL -o luau-lsp.zip \
            https://github.com/JohnnyMorganz/luau-lsp/releases/download/1.70.1/luau-lsp-linux-x86_64.zip
          unzip -q luau-lsp.zip -d luau-lsp-bin
          sudo install -m755 luau-lsp-bin/luau-lsp /usr/local/bin/luau-lsp
          luau-lsp --version

      - name: Fetch Roblox type definitions
        run: |
          curl -fsSL -o globalTypes.d.luau \
            https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/main/scripts/globalTypes.d.luau

      - name: Type-check
        run: |
          luau-lsp analyze \
            --platform=roblox \
            --definitions=globalTypes.d.luau \
            --sourcemap=sourcemap.json \
            src

      - name: Build place
        run: |
          mkdir -p build
          rojo build -o build/game.rbxlx
          test -s build/game.rbxlx
